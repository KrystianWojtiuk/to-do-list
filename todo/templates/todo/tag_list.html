{% extends "todo/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url 'tag_create' %}" class="btn btn-primary">➕ New Tag</a>
</div>

<table class="table table-striped table-hover align-middle" style="width: 50%;">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td>{{ tag.name }}</td>
            <td>
                <a href="{% url 'tag_update' tag.id %}" class="btn btn-sm btn-outline-primary mb-1">✏️ Edit</a>
                <a href="{% url 'tag_delete' tag.id %}" class="btn btn-sm btn-outline-danger mb-1">🗑 Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center">No tags yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
